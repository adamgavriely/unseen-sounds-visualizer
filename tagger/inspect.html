<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag Inspector</title>
<link rel="stylesheet" href="src/style.css">
<style>
  .drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted);background:var(--surface);margin:12px 16px}
  .drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .files{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
  .chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface)}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .stats{font-size:13px;color:var(--muted)}
  .tl{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px 10px;margin:6px 0 12px}
  .axis{position:relative;height:18px;margin-left:110px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .axis span{position:absolute;transform:translateX(-50%)}
  .lane{display:flex;align-items:stretch;border-top:1px solid var(--line)}
  .lane .who{width:110px;flex:none;font-size:12px;color:var(--muted);padding:6px 6px 6px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .track{position:relative;flex:1;min-height:30px}
  .bar-s{position:absolute;height:22px;border-radius:5px;font-size:12px;line-height:22px;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;color:#fff;border:1px solid rgba(0,0,0,.15)}
  .bar-s.need{background:#3E5C76}
  .bar-s.vis{background:#B08A3E}
  .bar-s.obv{background:#9AA5B1}
  .bar-s:focus-visible,.bar-s:hover{outline:2px solid var(--ink);outline-offset:1px}
  .head{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);pointer-events:none;margin-left:110px}
  .legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:4px 0}
  .legend2 i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  table.rows{width:100%;border-collapse:collapse;font-size:14px}
  table.rows th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;text-align:left;border-bottom:1px solid var(--line);padding:4px 6px}
  table.rows td{border-bottom:1px solid var(--line);padding:5px 6px;font-variant-numeric:tabular-nums}
  table.rows tr.click{cursor:pointer}
  table.rows tr.click:hover{background:#eef1f4}
  .yes{color:var(--ok);font-weight:600}.no{color:var(--muted)}
  .flag{display:inline-block;font-size:12px;border-radius:5px;padding:1px 7px;margin-right:6px}
  .flag.bad{background:var(--bad-soft);color:var(--bad)}.flag.none{background:var(--warn-soft);color:var(--warn)}.flag.done{background:var(--ok-soft);color:var(--ok)}
  .scroll{overflow-x:auto}
  .empty{color:var(--muted);padding:30px 0;text-align:center}
</style>
</head>
<body>
<div class="bar">
  <b class="brand">Tag inspector</b>
  <label class="status">Load export file(s): <input type="file" id="files" accept=".json,application/json" multiple></label>
  <label class="status"><input type="checkbox" id="showAll"> show untagged clips too</label>
  <span class="grow"></span>
  <span class="stats" id="stats"></span>
</div>
<div class="drop" id="drop">Drop one or more <b>tagger_*.json</b> files here (or use the button above). Nothing is uploaded; everything stays in this browser.</div>
<div class="wrap">
  <aside class="side">
    <div class="side-head"><b>Clips</b> <span class="hint" id="nclips"></span></div>
    <ul class="cliplist" id="list"></ul>
  </aside>
  <main>
    <div class="nav"><button id="prev" type="button">&larr; Previous</button><h2 id="title">—</h2><button id="next" type="button">Next &rarr;</button><span id="flags"></span></div>
    <video id="video" controls preload="auto" playsinline></video>
    <div class="player"><span class="time" id="time">0.0 s</span><span class="hint">Click a bar or a row to jump 0.5 s before its start.</span></div>
    <div class="tl" id="tl">
      <div class="axis" id="axis"></div>
      <div id="lanes"></div>
      <div class="head" id="head"></div>
    </div>
    <div class="legend2"><span><i style="background:#3E5C76"></i>needed (not visible, not obvious)</span><span><i style="background:#B08A3E"></i>visible but not obvious</span><span><i style="background:#9AA5B1"></i>obvious from the picture</span></div>
    <div class="card"><div class="scroll"><table class="rows" id="rows"></table></div></div>
    <div class="card" id="notes"></div>
  </main>
</div>
<script src="src/clips.js"></script>
<script src="src/inspect.js"></script>
</body>
</html>
